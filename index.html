var C=[
["Il neigeait depuis le matin quand Mélanie trouva sur le seuil une enveloppe scellée de cire argentée. À l’intérieur, un grimoire à la couverture de givre, si froid qu’il fumait entre ses doigts, et une lettre d’une écriture fine, légèrement tremblante.\n\nAu loin, par-delà les toits, elle crut voir une étoile vaciller, comme une bougie dans un courant d’air. Elle déplia la lettre.","Le mot s’éveilla sur la page, lettre après lettre, et une brise tiède fit frémir les feuillets. Dans l’air glacé, un souffle doux répondit : quelqu’un, quelque part, avait entendu son appel. Mélanie posa la main sur la couverture. Le Grimoire des Veilles venait de s’ouvrir pour elle."],
["Cette nuit-là, Mélanie dormit mal. Vers minuit, un craquement léger la tira du lit : sur le rebord de la fenêtre, deux yeux de glace pâle brillaient dans le noir. Un chat entra sans bruit, un chat blanc comme la neige, aussi grand qu’un loup, dont les pas ne laissaient aucune trace sur le parquet.\n\nIl s’assit devant elle, la regarda longuement, puis laissa tomber de sa gueule un petit parchemin couvert de signes étranges. Il semblait attendre qu’elle comprenne.","Les lettres retrouvèrent leur place et le chat cligna lentement des yeux, comme on dit merci. Il se leva, se glissa dehors, et la neige se creusa devant lui d’un sentier à peine visible, qui s’enfonçait vers le fond du jardin, là où se dressait le plus vieil arbre des environs."],
["Au pied du grand arbre, Mélanie découvrit des empreintes de toutes sortes : de larges coussinets, de minuscules sabots, et des taches grises et fondues, comme si de l’encre avait coulé sur la neige. Soudain, une petite lumière tremblante jaillit d’une branche, suivie d’une volute de fumée et d’un éternuement fracassant.\n\n« Atchoum ! Pardon ! » Une luciole grosse comme un pouce se cachait derrière une aile, tandis qu’un dragonnet à grelot toussotait des étincelles. « Nous sommes Pimprenelle et Grelot ! chuchota la luciole. Surtout, ne marche pas sur les taches noires. C’est de la Brume. »","La piste livra son secret et la lumière de Pimprenelle se mit à danser de joie. Grelot, lui, avait déjà posé sa petite patte griffue sur la botte de Mélanie, comme pour dire : « Où tu vas, on va. » Derrière eux, le chat blanc attendait, la queue dressée. L’équipe était au complet."],
["Le sentier mènait à un pont de glace jeté sur un torrent figé. Il ne faisait pas plus de trois pas de large, et il chantait sous le vent d’une voix craquante, comme un violon qu’on accorde. Quand Mélanie avança le pied, une voix gelée s’éleva du parapet : « Nul ne passe sans me dire mon nom. »\n\nPimprenelle se cacha dans le col de Mélanie. Grelot, vexé, recula en soufflant une braise qui s’éteignit aussitôt.","À peine le mot fut-il prononcé que le givre se fendit en mille éclats cristallins. Le pont se mit à briller d’un bleu pâle qui rappelait l’aube, et la voix soupira : « Passe, jeune Gardienne. Il y a bien longtemps que personne ne m’avait appelé par mon nom. »"],
["Au-delà du pont, la forêt devint si sombre que Mélanie ne distinguait plus ses propres mains. Le chat blanc la guida jusqu’à une cabane de garde-forêt dont la porte pendait sur ses gonds. Dedans, sur une table couverte de poussière de glace, une forme sombre était posée. Pimprenelle essaya de l’éclairer, mais sa lumière tremblait trop.\n\nSur la table, quelques lettres s’étaient détachées du Grimoire et flottaient en désordre dans l’obscurité.","Les lettres se rassemblèrent et l’objet s’embrasa d’une flamme claire, dorée, qui chassa les ombres jusque dans les coins. Pimprenelle poussa un petit cri de joie et cessa de trembler. Mélanie leva la lumière devant elle : pour la première fois depuis longtemps, la forêt lui sembla moins hostile."],
["La clarté les mena jusqu’à la lisière. Là, un mur de brume grise, épais comme un rideau, barrait le chemin. Mélanie y plongea la main : elle ne rencontra que du froid, un froid qui rongeait les souvenirs. Elle revit en un éclair des étoiles, des rires, des cadeaux, puis plus rien.\n\nLe chat blanc leva le museau vers le ciel, et Mélanie comprit ce qu’il voulait dire : il faudrait un vent assez fort pour tout emporter.","Le mot, soufflé du fond du cœur, devint vent. Il s’engouffra dans la brume, la déchira en lambeaux et la dispersa sur les cimes. Devant Mélanie s’ouvrit un chemin d’argent qui descendait vers une vallée où brillaient, tout petits, les toits d’un village. La forêt des Murmures était derrière elle."],
["Le village était figé. Les cheminées fumaient sans que la fumée monte, un chien courait sans avancer, une marchande tendait un pain d’épice à un enfant, tous deux immobiles comme des statues de sucre. Sur la place, quatre grandes horloges brillaient encore, mais chacune racontait une histoire différente.\n\nGrelot, ravi, s’approcha trop près d’un étal de pain d’épice et dut être rattrapé par la queue.","Les aiguilles tremblèrent, puis une horloge fit tic… puis tac… Quelque part dans le village, une porte s’ouvrit en grinçant. « Un elfe ! cria une voix fluette. Il y a donc encore quelqu’un pour nous réveiller ! » Mélanie sourit : peut-être que le Grimoire avait eu raison de lui faire confiance."],
["Un petit homme à barbe blanche, juché sur un tabouret, tentait désespérément de remettre en marche une machinerie de laiton. C’était Maître Tic, horloger du village depuis plus de trois cents hivers. « Mes rouages, mes beaux rouages ! gémit-il. Le gel les a tous brouillés. Et j’ai oublié le code du coffre où dorment les clés du temps. »\n\nIl tendit à Mélanie des clochettes, des sapins et des étoiles en cuivre, chacun gravé d’un chiffre.","Le coffre s’ouvrit dans un cliquetis joyeux et Maître Tic essuya une larme de bonheur. « Trois chiffres, trois secrets ! Vous avez l’esprit d’une vraie Gardienne. » Dans le coffre : une cloche minuscule, un fil d’argent, et une pendule privée de ses aiguilles."],
["Au centre de la place pendait la grande cloche du village, fendue d’une longue fissure. Quand le vent la frôla, elle émit des sons étranges : un long, deux courts, un long… Pimprenelle s’illumina d’un coup : « Elle parle ! Elle essaie de parler ! »\n\nMélanie ferma les yeux et écouta, une main sur le métal froid. Les sons revenaient toujours dans le même ordre, comme un message répété par quelqu’un qui a peur d’être oublié.","La cloche vibra une dernière fois, longuement, puis un son clair retentit dans tout le village. Les habitants s’agitèrent, cliguèrent des yeux, et l’on entendit pour la première fois depuis longtemps un rire d’enfant. La Brume venait de perdre l’une de ses voix."],
["Mais le bonheur dura peu. Maître Tic poussa un cri : la Pendule du village, celle qui rythme toutes les autres, avait disparu de son socle. Trois suspects s’étaient rassemblés sous le porche : un corbeau noir aux yeux perçants, un renard roux aux moustaches frémissantes, un hibou à l’air solennel.\n\nGrelot grogna, le chat blanc plissa les yeux. Il fallait trouver le coupable avant la nuit.","Sous l’aile du corbeau, on découvrit la Pendule, enveloppée dans un morceau de brume. Il baissa la tête, honteux : « La Brume m’avait promis des plumes d’or. » Mélanie lui tendit la main : « Viens m’aider à réveiller le village. » Le corbeau hésita, puis rendit l’objet. Pimprenelle, perchée sur son épaule, murmura que personne n’est jamais perdu pour de bon."],
["La Pendule retrouvée restait muette. Maître Tic la posa sur la table de son atelier, ouvrit un petit tiroir et en sortit une longue bande de papier couverte de nombres. « Elle attend l’heure magique, expliqua-t-il, celle où toutes les magies s’éveillent. Je ne m’en souviens plus, mais ma grand-mère l’avait écrite en chiffres, pour que seuls les curieux la trouvent. »\n\nIl tendit la bande à Mélanie avec un clin d’œil.","Le dernier chiffre déchiffré, la Pendule frémit et ses aiguilles reparurent. Elle se mit à battre, d’abord lentement, comme un cœur qui se réveille, puis de plus en plus fort. Dans tout le village, les horloges reprirent leur ronde et les rues s’animèrent. Le temps coulait de nouveau."],
["Le soir venu, le village entier se rassembla sur la place pour remercier la Gardienne. Les enfants dansaient, la marchande de pain d’épice offrit un sac plein à Grelot, qui faillit s’évanouir de bonheur. Mais le chat blanc fixait le ciel. Au-dessus des montagnes, la lune montait, toute ronde, et son reflet sur le grand cadran dessinait quatre lettres cachées.\n\nLe Grimoire s’agita dans les bras de Mélanie.","La lune se leva tout à fait et traça un chemin d’argent qui montait vers les cimes. « Les Cavernes de Cristal, dit Maître Tic à voix basse. Là-haut, rien n’est jamais ce qu’il semble. » Mélanie salua le village, rangea le Grimoire dans son sac et suivit le chat blanc sur le sentier lumineux."],
["Après des heures de marche dans la neige poudreuse, ils arrivèrent devant une paroi de glace immense où s’ouvrait une porte de cristal. Mélanie s’en approcha et vit son reflet… mais à l’envers. Les lettres gravées sur le seuil se reflétaient elles aussi à rebours.\n\nPimprenelle, perchée sur son épaule, se vit en double, puis en triple. « C’est un piège ! » souffla Grelot, qui n’avait pas l’habitude des miroirs.","La porte tourna sans bruit sur ses gonds de glace, et un éclat de lumière éblouit Mélanie. Derrière, un monde entier brillait : des colonnes de cristal, des stalactites d’argent, un lac souterrain où dansaient mille reflets. Au plafond, un prisme géant faisait naître, par instants, de minuscules arcs-en-ciel."],
["Mais la beauté de la caverne était trompeuse : tout y était gris, d’un gris terne et triste. La Brume avait volé les couleurs. Sur un autel de glace, trois pots de peinture attendaient, un rouge, un jaune, un bleu, et un message gravé : « Rendez les couleurs à qui sait les mêler. »\n\nGrelot, curieux, trempa la patte dans le pot rouge et laissa une empreinte sur la neige.","Les couleurs jaillirent des pots et coururent le long des parois. Le violet s’étira comme un chat, le vert s’enroula autour des stalactites, l’orange éclata en feu d’artifice. Pimprenelle pleura de joie : sa lumière prit toutes les teintes à la fois. La caverne retrouvait son âme."],
["Plus loin, une galerie s’ouvrit sur une grotte immense. Mélanie appela : « Il y a quelqu’un ? » Une voix lui répondit aussitôt : « …quelqu’un… quelqu’un… » Elle sursauta, s’approcha, parla plus bas. La voix l’imita, mot pour mot.\n\nPimprenelle, terrifiée, se cacha derrière le chat blanc, qui ne bougeait pas, les oreilles dressées. Quelque chose se cachait dans les parois et jouait avec eux.","Quand le mot fut dit, la voix hésita, puis éclata d’un rire joyeux : « Enfin quelqu’un qui sait qui je suis ! » Les parois s’écartèrent et révélèrent un passage étroit, éclairé de lueurs bleutées. Au fond, quelque chose clignotait doucement, comme si on les attendait."],
["Le passage menait à une salle ronde, plongée dans le noir. Seule Pimprenelle brillait, mais elle clignotait de plus en plus vite, par petits éclairs courts et longs, comme si elle voulait dire quelque chose de très important. « Je n’arrive plus à parler, avoua-t-elle, la voix tremblante. J’ai peur. Je peux seulement… allumer et éteindre. »\n\nMélanie sortit son carnet et nota chaque éclat.","À mesure que Mélanie déchiffrait ses signaux, Pimprenelle retrouva son sourire. Soudain, les cristaux alentour s’allumèrent un à un, répondant à la petite luciole, jusqu’à ce que toute la salle brille comme un ciel d’été. « Je n’ai plus peur », murmura Pimprenelle, qui rayonnait."],
["Un grondement ébranla la caverne. Au fond de la salle, un colosse de glace se leva : un golem de cristal, haut comme une maison, dont les yeux brillaient d’un bleu froid. Il ne criait pas, il ne menaçait pas. Il montra simplement, sur le sol, un carré de pierre divisé en seize cases, dont certaines étaient vides.\n\nGrelot lança une étincelle sur lui : elle ricocha sans effet. Mélanie comprit qu’il fallait résoudre l’énigme plutôt que se battre.","Le dernier chiffre se posa et le golem inclina lentement sa tête immense. Un son profond, presque un soupir, monta de sa poitrine de cristal. Il se rassit, tourna le dos au passage, et la voie s’ouvrit. « Merci », lui dit Mélanie. Il ne répondit pas, mais ses yeux s’adoucirent."],
["Au fond de la dernière caverne, un coffret d’argent reposait sur un socle de glace. Dessus, cinq cases vides et une inscription : « Ce que tu as appris ouvre ce qui est caché. » Mélanie sortit son carnet. Elle y avait noté chaque réponse, chaque mot, chaque détail.\n\nLe chat blanc s’assit à côté d’elle, la queue enroulée autour des pattes. Pimprenelle se posa sur le couvercle. Grelot, impatient, tapa du pied.","Le couvercle s’ouvrit dans un tintement de clochettes. Au creux du velours, une perle laiteuse, grosse comme une noix, rayonnait d’une lumière douce et chaude : la Perle d’Aurore. En la touchant, Mélanie sentit toute la tristesse des cavernes s’en aller. Au-dessus d’elle, le plafond s’ouvrit sur un ciel étoilé : la sortie."],
["Au-delà des montagnes se dressait le Château de Brume, un édifice gris, sans fenêtre éclairée, dont les murs semblaient faits de fumée solide. Aucun oiseau ne chantait, aucun vent ne soufflait, pas même un craquement de glace. Le silence était si dense que Mélanie entendit son propre cœur battre.\n\nUne voix glaciale, sans visage, résonna dans les couloirs : « Bienvenue, petite Gardienne. Ici, rien ne change, rien ne finit. Il n’y a que moi. »","À peine eut-elle prononcé le mot que le calme se fendit comme du verre. Un rire étonné, presque humain, traversa les murs. « Comment as-tu osé… » La voix de Morneval trembla un instant. Les lourdes portes du château s’entrouvrirent. Mélanie entra, flanquée du chat blanc, de Pimprenelle et de Grelot."],
["Dans une grande salle ronde, les murs étaient de glace épaisse et les braises d’une immense cheminée dormaient, éteintes. Une porte de glace barrait le fond, couverte d’inscriptions. « Il faut une flamme, murmura Pimprenelle. Une vraie, une qui n’a pas peur. »\n\nGrelot se mit à trembler, puis se redressa. Il gonfla ses petites ailes, ferma les yeux et fit un pas vers la porte. « Je suis un dragon », dit-il d’une voix qui tremblait à peine.","Grelot souffla. Pas une étincelle, pas une braise : une vraie flamme, éclatante, qui lécha la glace et la fit fondre en un instant. La porte s’effondra en gouttes d’or. Le petit dragonnet s’assit, hors d’haleine, la mine stupéfiée. Mélanie le serra contre elle : « Tu es le plus courageux des dragons. »"],
["Derrière la porte, un hall sombre. Trois portes célestes s'alignaient, chacune gravée d'un symbole et d'une suite de nombres qui se terminait par un trou. Aucune poignée. « Il faut toutes les ouvrir, souffla Pimprenelle. ». Mélanie posa la main sur la première. Le plafond se mit à s'assombrir, et les étoiles surgirent. La pierre se dissipa, remplacée par un dôme infini de constellations. Au-dessus des portes, les astres traçaient une carte : trois figures, trois portes, et dans chaque figure, une étoile éteinte. Les nombres n'étaient pas des nombres. C'étaient des coordonnées : le premier chiffre pour la colonne, le second pour la ligne. Chaque trou correspondait à l'étoile manquante. Il fallait la rallumer, porte après porte, pour que le verrou cède","Elle appuya. La première constellation s'embrasa. La deuxième. La troisième. Les trois portes s'ouvrirent ensemble, comme les pages d'un livre. Derrière elles, une salle immense où trônait un miroir couvert d'un voile gris. Au centre, une silhouette drapée de brume attendait, immobile, un vieux livre aux pages jaunies dans les mains."],
["Le Sire Morneval se retourna. Sous la capuche de brume, Mélanie ne vit pas un monstre, mais un visage jeune, fatigué, presque enfantin. Le voile glissa du miroir : il y apparut un apprenti aux joues rondes, un grimoire serré contre la poitrine.\n\n« Avant d’être Morneval, j’avais un nom, dit la voix. Aldéa me l’avait donné. J’ai eu si peur que Noël finisse que j’ai voulu le figer à jamais. Mais ce qu’on fige s’éteint. Je ne m’en souviens plus. Aide-moi. »","Le nom brilla dans le miroir, lettre après lettre. À sa lecture, le visage de Morneval se détendit et la brume tomba de ses épaules comme un manteau trop lourd. « Élian… murmura-t-il. Oui, c’est moi. » Il leva vers Mélanie des yeux humides, remplis de gratitude : « Merci de m’avoir rappelé qui j’étais. »"],
["Élian posa la main sur le Grimoire. Alors, les vingt-trois runes que Mélanie avait gagnées s’élevèrent dans les airs et se mirent à tourner autour d’eux, formant un grand cercle de lumière. Mais au centre de ce cercle, un carré magique s’était effacé : sans lui, rien ne pouvait tenir.\n\nLe chat blanc posa une patte sur le sol, Pimprenelle éclaira la page, Grelot veilla, la queue enroulée autour des pattes. Mélanie prit son crayon.","Les chiffres s’inscrivirent dans le carré et le cercle de runes tourna plus vite, plus clair, plus chaud. Une lumière douce monta vers le plafond du château, qui se déchira comme un voile. Au loin, tout au bout du ciel, une étoile presque éteinte se remit à battre, faiblement. Il ne manquait plus qu’un geste."],
["Ils montèrent tous ensemble jusqu’au sommet de la Tour de l’Étoile : Mélanie, Élian, le chat blanc, Pimprenelle, Grelot, et Aldéa enfin retrouvée, dont la voix revenait doucement. Il était minuit. Vingt-trois runes brillaient au-dessus du cristal central, mais la vingt-quatrième manquait.\n\n« Je ne sais pas comment la rallumer, avoua Élian. » Aldéa sourit : « Il faut ce que Noël a de plus précieux. » Tous se rapprochèrent.","Mélanie prononça le dernier mot. Alors chacun posa la main sur le cristal : Élian, Aldéa, Givre, Pimprenelle, Grelot. La vingt-quatrième rune s’alluma et l’Étoile éclata en une lumière dorée qui embrasa le ciel entier. Dans tout Givrelune, les cloches sonnèrent, les villageois sortirent dans la rue, les enfants s’éveillèrent en riant.\n\n« Merci, Mélanie, dit Aldéa. Le Grimoire sait ce qu’il fait. » Élian pleurait de joie. Sur le seuil de la Tour, Givre ronronna : il avait enfin retrouvé sa maison. Joyeux Noël, Gardienne."]
